name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format (for example, v1.2.3)." >&2
            exit 1
          fi
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD repository secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS repository secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD repository secret}"

          keystore_file="$RUNNER_TEMP/release-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          echo "ANDROID_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests and build signed release APK and AAB
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon \
            "-PappVersionName=$VERSION_NAME" \
            "-PappVersionCode=$VERSION_CODE"

      - name: Prepare release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk="$RUNNER_TEMP/HackBitsKannada-$VERSION_NAME.apk"
          aab="$RUNNER_TEMP/HackBitsKannada-$VERSION_NAME.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          cd "$RUNNER_TEMP"
          sha256sum "HackBitsKannada-$VERSION_NAME.apk" "HackBitsKannada-$VERSION_NAME.aab" > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/HackBitsKannada-${{ steps.version.outputs.name }}.apk
            ${{ runner.temp }}/HackBitsKannada-${{ steps.version.outputs.name }}.aab
            ${{ runner.temp }}/SHA256SUMS
