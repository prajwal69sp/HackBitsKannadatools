name: Admin panel CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hbk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: hackbitskannada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hbk -d hackbitskannada"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hbk:ci-only-password@localhost:5432/hackbitskannada?schema=public
      ADMIN_SESSION_SECRET: ci-only-session-secret-0123456789-abcdef
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-only-admin-password-2026
      CORS_ALLOWED_ORIGINS: https://android.example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Seed educational content and temporary CI admin
        run: npm run seed
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Run authenticated API integration tests
        run: npm run test:integration
        env:
          API_BASE_URL: http://127.0.0.1:3000
